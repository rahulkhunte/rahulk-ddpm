# DDPM Training Configuration
dataset: CIFAR10
image_size: 32
in_channels: 3

# Model
base_channels: 64
time_dim: 256

# Diffusion
T: 1000
# Cosine schedule (Nichol & Dhariwal, 2021) — replaces linear beta schedule
# ā_t = cos²((t/T + s)/(1+s) · π/2),  s=0.008 offset prevents ā_T from reaching exactly 0
noise_schedule: cosine
cosine_s: 0.008

# Training
epochs: 50
batch_size: 128
learning_rate: 0.0001
num_workers: 4
pin_memory: true

# EMA (Exponential Moving Average)
# Standard in production diffusion pipelines — samples at inference use EMA weights
ema_decay: 0.9999

# Logging
save_every: 10
checkpoint_dir: checkpoints/
sample_dir: assets/samples/

# ── Video diffusion prototype (train_video.py / sample_video.py) ──────────────
# Reuses top-level T / cosine_s / time_dim / ema_decay. Image pipeline above
# is unaffected by anything under this `video:` key.
video:
  dataset: synthetic        # synthetic | movingmnist
  in_channels: 1
  num_frames: 16
  frame_size: 32
  num_samples: 512          # size of the synthetic dataset
  seed: 0

  # Lightweight spatiotemporal DiT
  patch_size: 4
  patch_t: 2
  hidden_dim: 256
  depth: 4
  num_heads: 4

  # Training
  epochs: 5
  batch_size: 8
  learning_rate: 0.0001
  save_every: 1
  # Low-t loss weighting: w(t) = 1 + lambda*(1 - t/T), mean-normalised. Emphasises
  # the low/mid-noise steps where the moving square is reconstructed; high-t steps
  # keep weight 1 so the generative prior is not starved.
  loss_t_weighting: false
  loss_t_weight_lambda: 1.0
  # min-SNR-gamma weighting (Hang et al. 2023); null = off. Set e.g. 5.0 to
  # emphasise high-noise steps where structure must nucleate from pure noise.
  min_snr_gamma: null
  # Lower than the image pipeline's 0.9999: video runs are only a few-k steps, so
  # a high decay leaves the EMA shadow dominated by the random init. 0.999 lets
  # EMA track the trained weights (0.999^9600 ≈ 7e-5 init weight).
  ema_decay: 0.999
  checkpoint_dir: checkpoints/video/
  sample_dir: assets/video_samples/
